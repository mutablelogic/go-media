name: Release

# The images, and the libraries as archives attached to the release, are
# published for each release. Run by hand, the images are published with the
# branch's name, and the archives are uploaded as the run's artifacts, to try
# them before a release. Each week, the runtime images of the latest release
# are built again, for Debian's security updates, which compiles nothing.
on:
  release:
    types: [published, edited]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  packages: write

# docker/build-push-action uploads a record of each build as an artifact,
# which would be listed with the archives, so it doesn't
env:
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  # The libraries, built in the dev image, which is published to build with,
  # and packaged from it as go-media-<version>-<license>-linux-<arch>.tar.gz,
  # to build with outside a container. They aren't built again each week
  linux-libraries:
    name: Build Linux ${{ matrix.license }} ${{ matrix.arch }} libraries
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        license: [gpl, lgpl]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - license: gpl
            spdx: Apache-2.0 AND GPL-3.0-or-later
          - license: lgpl
            spdx: Apache-2.0 AND LGPL-3.0-or-later
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release, or the branch
      - name: Choose the version
        id: version
        run: echo "tag=${GITHUB_REF_NAME//[^A-Za-z0-9_.-]/-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: etc/docker/Dockerfile.linux
          target: dev
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/go-media:${{ steps.version.outputs.tag }}-${{ matrix.license }}-dev-linux-${{ matrix.arch }}
          build-args: |
            OS=linux
            ARCH=${{ matrix.arch }}
            LICENSE=${{ matrix.license }}
            SPDX=${{ matrix.spdx }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

      # The dev image has the libraries' stamps, so they aren't built again.
      # The version is from git, as the Makefile's is, as the image has no git
      - name: Package the libraries
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/go-media:${{ steps.version.outputs.tag }}-${{ matrix.license }}-dev-linux-${{ matrix.arch }}
        run: |
          version=$(git describe --tags --always | sed 's/^v//')
          docker run --rm --platform linux/${{ matrix.arch }} --volume "$PWD:/src" --workdir /src "$IMAGE" \
            make GO=true PREFIX=/opt/go-media OS=linux ARCH=${{ matrix.arch }} VERSION="$version" libraries-archive

      - name: Attach the libraries to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/go-media-*-${{ matrix.license }}-linux-${{ matrix.arch }}.tar.gz --clobber

      - name: Upload the libraries
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: build/go-media-*-${{ matrix.license }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          archive: false

  # The runtime images, and gomedia, built on the dev image linux-libraries
  # published, so the libraries aren't built again. Each week, when
  # linux-libraries doesn't run, the runtime images are built again
  linux:
    name: Build Linux ${{ matrix.license }} ${{ matrix.arch }} images
    needs: linux-libraries
    if: ${{ !cancelled() && (needs.linux-libraries.result == 'success' || github.event_name == 'schedule') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        license: [gpl, lgpl]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - license: gpl
            spdx: Apache-2.0 AND GPL-3.0-or-later
          - license: lgpl
            spdx: Apache-2.0 AND LGPL-3.0-or-later
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release, or the branch, or for the weekly build, the latest
      # release, which is checked out
      - name: Choose the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            ref=$(gh release view --json tagName --jq .tagName)
            git checkout "$ref"
          else
            ref="$GITHUB_REF_NAME"
          fi
          echo "tag=${ref//[^A-Za-z0-9_.-]/-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The packages to run with, on the latest Debian image
      - name: Build and publish the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: etc/docker/Dockerfile.linux
          target: runtime
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/go-media:${{ steps.version.outputs.tag }}-${{ matrix.license }}-runtime-linux-${{ matrix.arch }}
          build-args: |
            OS=linux
            ARCH=${{ matrix.arch }}
            LICENSE=${{ matrix.license }}
            SPDX=${{ matrix.spdx }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

      # gomedia, built on the dev image and run on the runtime image, with
      # FFmpeg's GPL license, so its encoders are included
      - name: Build and publish the gomedia image
        if: github.event_name != 'schedule' && matrix.license == 'gpl'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: etc/docker/Dockerfile.linux
          target: gomedia
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gomedia:${{ steps.version.outputs.tag }}-linux-${{ matrix.arch }}
          build-args: |
            OS=linux
            ARCH=${{ matrix.arch }}
            LICENSE=${{ matrix.license }}
            SPDX=${{ matrix.spdx }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            DEV=ghcr.io/${{ github.repository_owner }}/go-media:${{ steps.version.outputs.tag }}-${{ matrix.license }}-dev-linux-${{ matrix.arch }}

  # gomedia, built with the gpl libraries from windows-libraries, so the
  # image has the libraries which are published, and they're only built once
  windows:
    name: Build Windows image
    if: github.event_name != 'schedule'
    needs: windows-libraries
    runs-on: windows-2022
    steps:
      - name: Configure git line endings
        shell: bash
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      # The zip is uploaded as it is, named by its file, which has the
      # version, so it's found with a pattern, and isn't unzipped
      - name: Download the libraries
        uses: actions/download-artifact@v8
        with:
          pattern: go-media-*-gpl-windows-amd64.zip
          path: build/download
          merge-multiple: true
          skip-decompress: true

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # 'inherit' keeps the Go toolchain (installed above by
          # actions/setup-go, outside MSYS2) visible inside the msys2 shell
          # alongside gcc/make/pkg-config - see test.yaml for the same setup.
          path-type: inherit
          install: >-
            base-devel
            make
            curl
            diffutils
            nasm
            unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libde265
            mingw-w64-x86_64-aom
            mingw-w64-x86_64-dav1d

      - name: Build gomedia.exe
        shell: msys2 {0}
        # The libraries are unpacked into build/install, with their stamps,
        # so make doesn't build them again. The cmd target doesn't itself
        # depend on the library-build targets (it only checks for them via
        # pkg-config to set feature tags), so they're made explicitly first,
        # which checks the stamps - see the same note on test.yaml.
        # gomedia.exe links libstdc++/libgcc/libwinpthread dynamically (this
        # project's own libraries are static, but MinGW's own C++/threading
        # runtime isn't), so those three DLLs are copied alongside it for
        # Dockerfile.windows to package together.
        run: |
          unzip -q "$(find build/download -name 'go-media-*-gpl-windows-amd64.zip' -type f | head -1)" -d build/install
          make ffmpeg chromaprint libexif libraw libheif libfvad
          make cmd
          cp "$MINGW_PREFIX"/bin/libstdc++-6.dll "$MINGW_PREFIX"/bin/libgcc_s_seh-1.dll "$MINGW_PREFIX"/bin/libwinpthread-1.dll build/

      - name: Verify Windows container engine
        shell: pwsh
        run: |
          $containerOS = docker info --format '{{.OSType}}'
          if ($containerOS -ne 'windows') {
            throw "Expected a Windows container engine, got '$containerOS'."
          }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Windows image
        shell: pwsh
        run: |
          $repository = "ghcr.io/$($env:GITHUB_REPOSITORY_OWNER)/gomedia".ToLowerInvariant()
          $source = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $refTag = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9_.-]', '-'
          $imageTag = "${repository}:${refTag}-windows-ltsc2022"

          $buildArgs = @('build', '--file', 'etc/docker/Dockerfile.windows', '--build-arg', "SOURCE=$source")
          $buildArgs += @('--tag', $imageTag)
          $buildArgs += '.'
          docker @buildArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          docker push $imageTag
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  # The Windows libraries, with their headers and pkg-config files, built
  # with MSYS2's MinGW64, are attached to the release as
  # go-media-<version>-<license>-windows-amd64.zip, to build with on Windows,
  # where the images can't be used
  windows-libraries:
    name: Build Windows ${{ matrix.license }} libraries
    if: github.event_name != 'schedule'
    runs-on: windows-2022
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        license: [gpl, lgpl]
    steps:
      - name: Configure git line endings
        shell: bash
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gpl libraries have the same key as test.yaml's and the windows
      # job's, so they reuse what those built, and the lgpl libraries have
      # their own
      - name: Cache libraries
        uses: actions/cache@v6
        with:
          path: build/install
          key: ${{ runner.os }}-libraries-${{ hashFiles('Makefile') }}${{ matrix.license == 'lgpl' && '-lgpl' || '' }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            make
            curl
            diffutils
            nasm
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libde265
            mingw-w64-x86_64-aom
            mingw-w64-x86_64-dav1d

      # The libraries don't need Go, whose cache the Makefile clears after
      # building libraw, so it's "true"
      - name: Build and package the libraries
        shell: msys2 {0}
        run: make GO=true FFMPEG_LICENSE=${{ matrix.license }} libraries-archive

      - name: Attach the libraries to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/go-media-*-${{ matrix.license }}-windows-*.zip --clobber

      # Also for a release, for the windows job to build with
      - name: Upload the libraries
        uses: actions/upload-artifact@v7
        with:
          path: build/go-media-*-${{ matrix.license }}-windows-*.zip
          if-no-files-found: error
          archive: false

  # The macOS libraries, built with Homebrew's, are attached to the release as
  # go-media-<version>-<license>-darwin-arm64.tar.gz, with a Brewfile of the
  # formulae they link with, to build with on a Mac
  darwin-libraries:
    name: Build macOS ${{ matrix.license }} libraries
    # Disabled for now, while the macOS runners are a problem; remove the
    # false to build the macOS archives again
    if: false && github.event_name != 'schedule'
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        license: [gpl, lgpl]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build tools
        run: brew install pkg-config nasm cmake libde265 aom dav1d

      # The libraries' pkg-config files name the Homebrew formulae they were
      # built with, so libraries built with other versions aren't reused
      - name: Fingerprint Homebrew
        id: homebrew
        run: echo "hash=-$(brew list --formula --versions | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # The gpl libraries have the same key as test.yaml's, so they reuse
      # what it built, and the lgpl libraries have their own
      - name: Cache libraries
        uses: actions/cache@v6
        with:
          path: build/install
          key: ${{ runner.os }}-libraries-${{ hashFiles('Makefile') }}${{ steps.homebrew.outputs.hash }}${{ matrix.license == 'lgpl' && '-lgpl' || '' }}

      # The libraries don't need Go, whose cache the Makefile clears after
      # building libraw, so it's "true"
      - name: Build and package the libraries
        run: make GO=true FFMPEG_LICENSE=${{ matrix.license }} libraries-archive

      - name: Attach the libraries to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/go-media-*-${{ matrix.license }}-darwin-*.tar.gz --clobber

      - name: Upload the libraries
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: build/go-media-*-${{ matrix.license }}-darwin-*.tar.gz
          if-no-files-found: error
          archive: false

  manifest:
    name: Publish multi-platform tags
    needs: [linux, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The libraries' images, as go-media:<version>-<license>-dev and
      # go-media:<version>-<license>-runtime, for amd64 and arm64, and the
      # gomedia image, as gomedia:<version>, and gomedia:latest for a release,
      # for Linux and Windows
      - name: Create the manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          if [ "$EVENT_NAME" = schedule ]; then
            ref=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            kinds="runtime"
          else
            ref="$REF_NAME"
            kinds="dev runtime"
          fi
          tag="${ref//[^A-Za-z0-9_.-]/-}"

          libraries="ghcr.io/${IMAGE_OWNER,,}/go-media"
          for license in gpl lgpl; do
            for kind in $kinds; do
              docker buildx imagetools create \
                --tag "$libraries:$tag-$license-$kind" \
                "$libraries:$tag-$license-$kind-linux-amd64" \
                "$libraries:$tag-$license-$kind-linux-arm64"
            done
          done

          # latest is only moved by a release, not by a branch run by hand
          if [ "$EVENT_NAME" != schedule ]; then
            image="ghcr.io/${IMAGE_OWNER,,}/gomedia"
            tags=(--tag "$image:$tag")
            if [ "$EVENT_NAME" = release ]; then
              tags+=(--tag "$image:latest")
            fi
            docker buildx imagetools create "${tags[@]}" \
              "$image:$tag-linux-amd64" \
              "$image:$tag-linux-arm64" \
              "$image:$tag-windows-ltsc2022"
          fi
