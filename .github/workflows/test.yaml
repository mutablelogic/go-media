name: "Test (WIP)"

on:
  workflow_dispatch:
  push:
    # workflow_dispatch can't target a non-default branch until the workflow
    # file exists on the default branch, so trigger on push to this branch
    # while it's still WIP. Remove once merged.
    branches: [djt/1007/windows]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report results for every platform, even if one fails
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Configure git line endings
        shell: bash
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        # libxml2-dev is already present on ubuntu-latest, which is enough for
        # the Makefile's own (non-static) pkg-config check to enable
        # --enable-libxml2. But ffmpeg's ./configure runs every pkg-config
        # check with --static, which also needs libxml2.pc's Requires.private
        # (liblzma) to resolve - hence liblzma-dev below even though nothing
        # directly asks for it.
        run: sudo apt -y update && sudo apt -y install nasm libde265-dev libaom-dev libdav1d-dev libxml2-dev liblzma-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config nasm

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # 'inherit' keeps the Go toolchain (installed above by actions/setup-go,
          # outside MSYS2) visible inside the msys2 shell alongside gcc/make/pkg-config
          path-type: inherit
          install: >-
            base-devel
            make
            curl
            diffutils
            nasm
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib

      - name: Build ffmpeg and run bindings tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        # libraw is required too: reader -> metadata -> pkg/raw (blank
        # import) -> sys/libraw. writer and frame don't need it.
        run: make ffmpeg libraw test-ffmpeg

      - name: Build ffmpeg and run bindings tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make ffmpeg libraw test-ffmpeg
