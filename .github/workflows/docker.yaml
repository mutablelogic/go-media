name: Docker

# The images are published for each release. Each week, the runtime images of
# the latest release are built again, for Debian's security updates, which
# compiles nothing.
on:
  release:
    types: [published, edited]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  linux:
    name: Build Linux ${{ matrix.license }} ${{ matrix.arch }} images
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        license: [gpl, lgpl]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - license: gpl
            spdx: Apache-2.0 AND GPL-3.0-or-later
          - license: lgpl
            spdx: Apache-2.0 AND LGPL-3.0-or-later
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release, or the branch, or for the weekly build, the latest
      # release, which is checked out
      - name: Choose the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            ref=$(gh release view --json tagName --jq .tagName)
            git checkout "$ref"
          else
            ref="$GITHUB_REF_NAME"
          fi
          echo "tag=${ref//[^A-Za-z0-9_.-]/-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The libraries, to build with, which isn't built again each week
      - name: Build and publish the dev image
        if: github.event_name != 'schedule'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: etc/docker/Dockerfile.linux
          target: dev
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/go-media:${{ steps.version.outputs.tag }}-${{ matrix.license }}-dev-linux-${{ matrix.arch }}
          build-args: |
            OS=linux
            ARCH=${{ matrix.arch }}
            LICENSE=${{ matrix.license }}
            SPDX=${{ matrix.spdx }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

      # The packages to run with, on the latest Debian image
      - name: Build and publish the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: etc/docker/Dockerfile.linux
          target: runtime
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/go-media:${{ steps.version.outputs.tag }}-${{ matrix.license }}-runtime-linux-${{ matrix.arch }}
          build-args: |
            OS=linux
            ARCH=${{ matrix.arch }}
            LICENSE=${{ matrix.license }}
            SPDX=${{ matrix.spdx }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

      # gomedia, built on the dev image and run on the runtime image, with
      # FFmpeg's GPL license, so its encoders are included
      - name: Build and publish the gomedia image
        if: github.event_name != 'schedule' && matrix.license == 'gpl'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: etc/docker/Dockerfile.linux
          target: gomedia
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gomedia:${{ steps.version.outputs.tag }}-linux-${{ matrix.arch }}
          build-args: |
            OS=linux
            ARCH=${{ matrix.arch }}
            LICENSE=${{ matrix.license }}
            SPDX=${{ matrix.spdx }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

  windows:
    name: Build Windows image
    if: github.event_name != 'schedule'
    runs-on: windows-2022
    steps:
      - name: Configure git line endings
        shell: bash
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      # The installed libraries, with their stamps, with the same key as
      # test.yaml's Windows job, as both build the same libraries from the
      # same Makefile, so this reuses what test.yaml built. There's no
      # fallback to an older Makefile's libraries, whose versions or
      # configuration may differ, so a release is never built with them.
      - name: Cache libraries
        uses: actions/cache@v6
        with:
          path: build/install
          key: ${{ runner.os }}-libraries-${{ hashFiles('Makefile') }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # 'inherit' keeps the Go toolchain (installed above by
          # actions/setup-go, outside MSYS2) visible inside the msys2 shell
          # alongside gcc/make/pkg-config - see test.yaml for the same setup.
          path-type: inherit
          install: >-
            base-devel
            make
            curl
            diffutils
            nasm
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libde265
            mingw-w64-x86_64-aom
            mingw-w64-x86_64-dav1d

      - name: Build gomedia.exe
        shell: msys2 {0}
        # The cmd target doesn't itself depend on the library-build targets
        # (it only checks for them via pkg-config to set feature tags), so
        # they're built explicitly first - see the same note on test.yaml.
        # gomedia.exe links libstdc++/libgcc/libwinpthread dynamically (this
        # project's own libraries are static, but MinGW's own C++/threading
        # runtime isn't), so those three DLLs are copied alongside it for
        # Dockerfile.windows to package together.
        run: |
          make ffmpeg chromaprint libexif libraw libheif libfvad
          make cmd
          cp "$MINGW_PREFIX"/bin/libstdc++-6.dll "$MINGW_PREFIX"/bin/libgcc_s_seh-1.dll "$MINGW_PREFIX"/bin/libwinpthread-1.dll build/

      - name: Verify Windows container engine
        shell: pwsh
        run: |
          $containerOS = docker info --format '{{.OSType}}'
          if ($containerOS -ne 'windows') {
            throw "Expected a Windows container engine, got '$containerOS'."
          }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Windows image
        shell: pwsh
        run: |
          $repository = "ghcr.io/$($env:GITHUB_REPOSITORY_OWNER)/gomedia".ToLowerInvariant()
          $source = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $refTag = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9_.-]', '-'
          $imageTag = "${repository}:${refTag}-windows-ltsc2022"

          $buildArgs = @('build', '--file', 'etc/docker/Dockerfile.windows', '--build-arg', "SOURCE=$source")
          $buildArgs += @('--tag', $imageTag)
          $buildArgs += '.'
          docker @buildArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          docker push $imageTag
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  manifest:
    name: Publish multi-platform tags
    needs: [linux, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The libraries' images, as go-media:<version>-<license>-dev and
      # go-media:<version>-<license>-runtime, for amd64 and arm64, and the
      # gomedia image, as gomedia:<version> and gomedia:latest, for Linux and
      # Windows
      - name: Create the manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          if [ "$EVENT_NAME" = schedule ]; then
            ref=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            kinds="runtime"
          else
            ref="$REF_NAME"
            kinds="dev runtime"
          fi
          tag="${ref//[^A-Za-z0-9_.-]/-}"

          libraries="ghcr.io/${IMAGE_OWNER,,}/go-media"
          for license in gpl lgpl; do
            for kind in $kinds; do
              docker buildx imagetools create \
                --tag "$libraries:$tag-$license-$kind" \
                "$libraries:$tag-$license-$kind-linux-amd64" \
                "$libraries:$tag-$license-$kind-linux-arm64"
            done
          done

          if [ "$EVENT_NAME" != schedule ]; then
            image="ghcr.io/${IMAGE_OWNER,,}/gomedia"
            docker buildx imagetools create \
              --tag "$image:latest" \
              --tag "$image:$tag" \
              "$image:$tag-linux-amd64" \
              "$image:$tag-linux-arm64" \
              "$image:$tag-windows-ltsc2022"
          fi
